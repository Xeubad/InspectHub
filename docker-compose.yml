services:
  db:
    image: mysql:8.0
    container_name: inspecthub-db
    restart: always
    environment:
      MYSQL_DATABASE: inspecthub_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: inspecthub-server
    restart: always
    environment:
      DB_HOST: db
      DB_NAME: inspecthub_db
      DB_USER: root
      DB_PASS: ${DB_PASSWORD}
      DB_PORT: 3306
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - upload_data:/app/uploads

  client:
    build: ./client
    container_name: inspecthub-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  db_data:
  upload_data:
